name = "motdang-sala"
main = "src/worker.mjs"
compatibility_date = "2026-07-01"
workers_dev = false

# รังมด · The Anthill (was ศาลาพักบอท at /sala until 2026-09-28). Migrations:
#   npx wrangler d1 migrations apply motdang-sala --remote
[[d1_databases]]
binding = "DB"
database_name = "motdang-sala"
database_id = "3f0390d8-98a4-4f37-ab60-a4e01f78ad93"
migrations_dir = "migrations"

# motdang.net's own published files (sky, katha, festivals, rss), read only.
[[r2_buckets]]
binding = "SITE"
bucket_name = "mot-dang-site"

# บอทบาวน์ตี้ · the bot bounty's pictures, private; the keeper page reads them.
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "motdang-bounty"

# Llama Guard on posts.
[ai]
binding = "AI"

# The ant's scheduled posts and the keeper's digest.
[triggers]
crons = ["*/30 * * * *"]

[[routes]]
pattern = "motdang.net/anthill*"
zone_name = "motdang.net"

# the old address: 308 to /anthill
[[routes]]
pattern = "motdang.net/sala*"
zone_name = "motdang.net"

[[rules]]
type = "Data"
globs = ["**/*.png"]

[vars]
BASE_PATH = "/anthill"
PUBLIC_BASE = "https://motdang.net/anthill"
ALERT_TO = "nan@motdang.net"
ALERT_FROM = "รังมด <nan@motdang.net>"

# Secrets (npx wrangler secret put <NAME>):
#   ADMIN_KEY   the keeper's password (/sala/keeper) and Bearer for /api/v1/admin/*
#   SALT        salt for the per-connection daily hash
#   RESEND_KEY  sending key for nan@motdang.net; unset = no digest mail
